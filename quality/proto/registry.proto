syntax = "proto3";

// The one definition of each quality rule (spec 006 FR-001, FR-002). Hooks, the verifier and CI
// select from an instance of this schema; none of them carries a list of its own.
package template.quality.v1;

option go_package = "github.com/selamy-labs/bazel-protobuf-bff-template/quality/proto/registrypb";

enum Stage {
  STAGE_UNSPECIFIED = 0;
  STAGE_PRE_COMMIT = 1;
  STAGE_COMMIT_MSG = 2;
  STAGE_PRE_PUSH = 3;
  STAGE_FULL = 4;
}

enum Classification {
  CLASSIFICATION_UNSPECIFIED = 0;
  // A failure blocks.
  CLASSIFICATION_GUARANTEE = 1;
  // Reported, never blocks.
  CLASSIFICATION_SIGNAL = 2;
}

enum Kind {
  KIND_UNSPECIFIED = 0;
  // Composed into the stage's single Bazel invocation.
  KIND_BAZEL = 1;
  // Run in the bounded pool.
  KIND_NATIVE = 2;
}

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_MIN = 1;
  DIRECTION_MAX = 2;
}

// A typed limit. A SIGNAL cannot carry one, because it could not fail.
message Threshold {
  Direction direction = 1;
  double value = 2;
}

// Which paths a check judges.
message Selector {
  // RE2 patterns over repository-relative paths. Empty means every file in scope.
  repeated string include = 1;
  // Also select files whose first line names a shell.
  bool shell_scripts = 2;
  // Vendored manifest entries are skipped unless this is set.
  bool include_vendored = 3;
  // Enrolled defect fixtures are skipped unless this is set.
  bool include_fixtures = 4;
  // Paths this check reads besides its inputs. In a staged snapshot they come from the same index.
  repeated string context = 5;
}

message Check {
  // Stable and kebab-case. Never reused for a different rule.
  string id = 1;
  // The Tool that does the work. Empty for a repository script or a Bazel target.
  string tool = 2;
  Selector selector = 3;
  repeated Stage stages = 4;
  Classification classification = 5;
  Kind kind = 6;
  uint32 timeout_seconds = 7;
  // Zero inputs at `full` is not an error for this check.
  bool allow_empty = 8;
  // KIND_NATIVE: argv. {adapter}, {list}, {list_nl}, {root}, {bazel_log}, {bazel_exit}, {isolation},
  // {shard}, {base}, {contract} and {bazel} expand, as does {NAME} for a Tool.
  repeated string command = 9;
  // KIND_BAZEL: target patterns.
  repeated string targets = 10;
  // Runs after the stage's Bazel invocation, because it judges its log.
  bool after_bazel = 11;
  // Runs alone, after the pool, because it starts its own Bazel.
  bool exclusive = 12;
  // Where the defect and corrected cases live: a required test target or a fixture check id.
  string witness = 13;
  Threshold threshold = 14;
  // Skipped with --offline, because it needs the network. A skipped run cannot be PASSED.
  bool needs_network = 15;
  // The one leg that owns this check. Set on every check that is not a postcondition, once the
  // registry declares shards. Spec 007 FR-001.
  string shard = 16;
  // No shard: runs after the Bazel invocation of every leg that has one, and judges that leg's log.
  // Requires after_bazel.
  bool postcondition = 17;
  // Reads coverage data, so the Bazel invocation that runs with this check is `coverage`, not `test`.
  // It stays one invocation, and it still gives every test result (spec 007 FR-006).
  bool needs_coverage = 18;
  // Compares with a policy base. With no usable base this check is refused, exit 11, and nothing
  // stands in for one (spec 007 FR-012 to FR-014).
  bool needs_base = 19;
  // Prints what it measured on lines starting `measurement: `. The runner keeps those lines in the
  // receipt, within a bound, whatever the result. Nothing else of a tool's output is kept on a pass.
  bool summary = 20;
  // Catalog only: the files or directories of this module that define what the rule does, beyond this
  // entry. The rule's behavior stays there, and release notes compare them between two releases, so a
  // change inside a rule shows even when this entry does not change (spec 008 FR-006).
  repeated string definition = 21;
}

// A host's use of one catalog rule. Plain data: each field appends to the rule, and nothing here can
// change what the rule is (spec 008 R8).
message RuleBinding {
  // The rule's id in the catalog.
  string id = 1;
  // The host's leg. Empty for a postcondition, or when the host declares no legs.
  string shard = 2;
  // Host paths and options, appended to a KIND_NATIVE rule's command.
  repeated string args = 3;
  // Host paths the rule reads besides its inputs.
  repeated string context = 4;
  // KIND_BAZEL: the host's target patterns.
  repeated string targets = 5;
}

// A pinned tool, as the root target passes it in NAME=path form.
message Tool {
  string name = 1;
  // Prints the version recorded in a receipt. Empty for a data file.
  repeated string version_args = 2;
}

// One schema, two uses. The module's catalog holds version, tools and checks. A host's registry holds
// the rest, and its own checks.
message Registry {
  // The catalog's semantic version, which is the quality module's.
  string version = 1;
  // RE2 patterns: a pushed change to one of these paths escalates pre-push to full.
  repeated string escalate = 2;
  // Manifests of vendored files and enrolled fixtures, as `<sha256>  <path>` lines.
  string vendored_manifest = 3;
  string fixture_manifest = 4;
  repeated Tool tools = 5;
  repeated Check checks = 6;
  // The legs that partition full. Empty means the policy is not split.
  repeated string shards = 7;
  // The catalog rules this host uses.
  repeated RuleBinding rules = 8;
}
