# Trusted publishing (spec 010 US6, FR-013, FR-014): on a tag of the trusted repository, build once, verify at that
# exact revision, publish the image by digest to the repository-linked package with the job's own token, attach
# the artifacts to the release, and verify anonymously from a credentialless job. No deployment runs here.
name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Allow unprivileged user namespaces on this disposable runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Verify at the tagged revision with the declared base
        env:
          POLICY_BASE: ${{ vars.POLICY_BASE }}
        run: tools/verify.sh "--base=$POLICY_BASE" --base-source=ci-event
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-receipt-${{ github.job }}-${{ github.run_attempt }}
          path: .verify/receipt.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # attaches the pre-release and its assets to the tag; the job's own token, trusted source only
      packages: write # publishes the image by digest to the repository-linked package; the next job holds nothing
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Allow unprivileged user namespaces on this disposable runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Publish by digest with the job's token
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: tools/release/publish.sh "$REPOSITORY" "$TAG"

  verify-published:
    name: verify-published
    needs: [publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Pull by digest anonymously and check the asset hashes
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: tools/release/verify_published.sh "$REPOSITORY" "$TAG"
