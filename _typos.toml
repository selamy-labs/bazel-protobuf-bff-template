[files]
# The vendored Spec Kit scaffold is pinned by hash manifest (specs/002-hermetic-skeleton R4) and is
# not edited here; generated lockfiles are not prose, and neither is the local demo's recording.
extend-exclude = [
  ".specify/",
  ".claude/skills/speckit-*/",
  "MODULE.bazel.lock",
  "*.sha256",
]

# An image is not prose: the local demo's recording is checked by its own witness, never for words.
[type.gif]
extend-glob = ["*.gif"]
check-file = false
